<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad5" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </radialGradient>
    <filter id="glow5" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrKV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#FFFF00"/>
    </marker>
    <marker id="arrUp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#8B949E"/>
    </marker>
  </defs>

  <!-- Background & Grid -->
  <rect width="960" height="490" rx="14" fill="url(#bgGrad5)" stroke="#1e293b" stroke-width="2"/>
  <g stroke="#58C4DD" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="80" x2="960" y2="80"/><line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="240" x2="960" y2="240"/><line x1="0" y1="320" x2="960" y2="320"/>
    <line x1="0" y1="400" x2="960" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="490"/><line x1="320" y1="0" x2="320" y2="490"/>
    <line x1="480" y1="0" x2="480" y2="490"/><line x1="640" y1="0" x2="640" y2="490"/>
    <line x1="800" y1="0" x2="800" y2="490"/>
  </g>

  <!-- Title -->
  <text x="34" y="42" fill="#ECECEC" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold">
    5. Повна архітектура Transformer: Encoder, Decoder та Causal Mask (-∞)
  </text>
  <text x="34" y="65" fill="#5CD0B3" font-family="Georgia, serif" font-style="italic" font-size="15">
    "Attention Is All You Need" — Двонапрямний Encoder + Авторегресійний Decoder (01:09:35 – 01:27:35)
  </text>

  <!-- COLUMN 1: ENCODER STACK -->
  <rect x="30" y="88" width="270" height="372" rx="12" fill="#5CD0B3" fill-opacity="0.07" stroke="#5CD0B3" stroke-width="2"/>
  <text x="165" y="114" fill="#5CD0B3" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">
    ENCODER (Стек N× блоків)
  </text>
  <text x="165" y="132" fill="#8B949E" font-family="sans-serif" font-size="11.5" text-anchor="middle">
    Бачить увесь вхідний контекст двонапрямно
  </text>

  <!-- Encoder Blocks (Bottom to Top flow) -->
  <rect x="48" y="396" width="234" height="44" rx="7" fill="#0b101b" stroke="#58C4DD" stroke-width="1.5"/>
  <text x="165" y="416" fill="#ECECEC" font-family="monospace" font-weight="bold" font-size="12.5" text-anchor="middle">Input Embeddings + PE</text>
  <text x="165" y="432" fill="#58C4DD" font-family="Georgia, serif" font-style="italic" font-size="12" text-anchor="middle">sin / cos позиційні хвилі</text>

  <line x1="165" y1="396" x2="165" y2="362" stroke="#8B949E" stroke-width="2" marker-end="url(#arrUp)"/>

  <rect x="48" y="314" width="234" height="44" rx="7" fill="#5CD0B3" fill-opacity="0.18" stroke="#5CD0B3" stroke-width="2"/>
  <text x="165" y="334" fill="#ECECEC" font-family="monospace" font-weight="bold" font-size="13" text-anchor="middle">Multi-Head Self-Attention</text>
  <text x="165" y="350" fill="#5CD0B3" font-family="sans-serif" font-size="11" text-anchor="middle">Q, K, V з одного вхідного шару</text>

  <rect x="48" y="270" width="234" height="32" rx="6" fill="#0b101b" stroke="#58C4DD" stroke-dasharray="4,2" stroke-width="1.4"/>
  <text x="165" y="290" fill="#58C4DD" font-family="monospace" font-size="12" text-anchor="middle">Add &amp; LayerNorm: LN(x + Sub(x))</text>

  <rect x="48" y="204" width="234" height="48" rx="7" fill="#83C167" fill-opacity="0.18" stroke="#83C167" stroke-width="2"/>
  <text x="165" y="226" fill="#ECECEC" font-family="monospace" font-weight="bold" font-size="13" text-anchor="middle">Feed-Forward Network (FFN)</text>
  <text x="165" y="242" fill="#83C167" font-family="Georgia, serif" font-style="italic" font-size="12" text-anchor="middle">max(0, zW₁ + b₁)W₂ + b₂</text>

  <rect x="48" y="158" width="234" height="32" rx="6" fill="#0b101b" stroke="#83C167" stroke-dasharray="4,2" stroke-width="1.4"/>
  <text x="165" y="178" fill="#83C167" font-family="monospace" font-size="12" text-anchor="middle">Add &amp; LayerNorm → Вихід Encoder</text>

  <!-- CROSS-ATTENTION BRIDGE (K_enc, V_enc) -->
  <path d="M 282 174 C 330 174, 310 286, 360 286" fill="none" stroke="#FFFF00" stroke-width="3.2" filter="url(#glow5)" marker-end="url(#arrKV)"/>
  <rect x="296" y="212" width="58" height="26" rx="5" fill="#0b101b" stroke="#FFFF00" stroke-width="1.5"/>
  <text x="325" y="230" fill="#FFFF00" font-family="Georgia, serif" font-weight="bold" font-size="13" text-anchor="middle">K, V</text>

  <!-- COLUMN 2: DECODER STACK -->
  <rect x="348" y="88" width="286" height="372" rx="12" fill="#9A72AC" fill-opacity="0.09" stroke="#9A72AC" stroke-width="2"/>
  <text x="491" y="114" fill="#9A72AC" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">
    DECODER (Авторегресійний N×)
  </text>

  <rect x="366" y="404" width="250" height="38" rx="7" fill="#0b101b" stroke="#9A72AC" stroke-width="1.5"/>
  <text x="491" y="427" fill="#ECECEC" font-family="monospace" font-size="12.5" text-anchor="middle">Зсунуті вихідні токени + PE</text>

  <rect x="366" y="340" width="250" height="48" rx="7" fill="#FC6255" fill-opacity="0.2" stroke="#FC6255" stroke-width="2"/>
  <text x="491" y="361" fill="#ECECEC" font-family="monospace" font-weight="bold" font-size="12.5" text-anchor="middle">1. Masked Multi-Head Attention</text>
  <text x="491" y="378" fill="#FC6255" font-family="sans-serif" font-weight="bold" font-size="11.5" text-anchor="middle">Causal Mask (-∞ для позицій &gt; t)</text>

  <rect x="366" y="262" width="250" height="54" rx="7" fill="#FFFF00" fill-opacity="0.16" stroke="#FFFF00" stroke-width="2.2" filter="url(#glow5)"/>
  <text x="491" y="284" fill="#FFFF00" font-family="monospace" font-weight="bold" font-size="13" text-anchor="middle">2. Encoder-Decoder Attention</text>
  <text x="491" y="303" fill="#ECECEC" font-family="Georgia, serif" font-style="italic" font-size="12.5" text-anchor="middle">Q ← з Decoder,  K, V ← з Encoder</text>

  <rect x="366" y="198" width="250" height="44" rx="7" fill="#83C167" fill-opacity="0.18" stroke="#83C167" stroke-width="1.8"/>
  <text x="491" y="224" fill="#ECECEC" font-family="monospace" font-weight="bold" font-size="12.5" text-anchor="middle">3. Feed-Forward + Add &amp; Norm</text>

  <rect x="366" y="136" width="250" height="44" rx="7" fill="#9A72AC" fill-opacity="0.28" stroke="#9A72AC" stroke-width="2"/>
  <text x="491" y="156" fill="#ECECEC" font-family="monospace" font-weight="bold" font-size="13" text-anchor="middle">Linear (d → |V|) + Softmax</text>
  <text x="491" y="172" fill="#FFFF00" font-family="Georgia, serif" font-style="italic" font-size="12" text-anchor="middle">P(w_{t+1} | w_{≤t}, X_{enc})</text>

  <!-- COLUMN 3: CAUSAL LOOK-AHEAD MASK & POSITIONAL ENCODING -->
  <rect x="654" y="88" width="276" height="372" rx="12" fill="#0b101b" fill-opacity="0.9" stroke="#FC6255" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="792" y="116" fill="#FC6255" font-family="Georgia, serif" font-weight="bold" font-size="16" text-anchor="middle">
    Causal Mask (Look-Ahead)
  </text>
  <text x="792" y="136" fill="#8B949E" font-family="sans-serif" font-size="11.5" text-anchor="middle">
    Блокує витік майбутніх токенів під час тренування:
  </text>

  <!-- 4x4 Causal Matrix Table -->
  <g transform="translate(684, 152)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="48" height="36" rx="4" fill="#58C4DD" fill-opacity="0.28" stroke="#58C4DD"/>
    <text x="24" y="23" fill="#ECECEC" font-family="Georgia, serif" font-size="14" text-anchor="middle">α₁₁</text>
    <rect x="54" y="0" width="48" height="36" rx="4" fill="#FC6255" fill-opacity="0.2" stroke="#FC6255"/>
    <text x="78" y="23" fill="#FC6255" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">-∞</text>
    <rect x="108" y="0" width="48" height="36" rx="4" fill="#FC6255" fill-opacity="0.2" stroke="#FC6255"/>
    <text x="132" y="23" fill="#FC6255" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">-∞</text>
    <rect x="162" y="0" width="48" height="36" rx="4" fill="#FC6255" fill-opacity="0.2" stroke="#FC6255"/>
    <text x="186" y="23" fill="#FC6255" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">-∞</text>

    <!-- Row 2 -->
    <rect x="0" y="42" width="48" height="36" rx="4" fill="#58C4DD" fill-opacity="0.28" stroke="#58C4DD"/>
    <text x="24" y="65" fill="#ECECEC" font-family="Georgia, serif" font-size="14" text-anchor="middle">α₂₁</text>
    <rect x="54" y="42" width="48" height="36" rx="4" fill="#58C4DD" fill-opacity="0.28" stroke="#58C4DD"/>
    <text x="78" y="65" fill="#ECECEC" font-family="Georgia, serif" font-size="14" text-anchor="middle">α₂₂</text>
    <rect x="108" y="42" width="48" height="36" rx="4" fill="#FC6255" fill-opacity="0.2" stroke="#FC6255"/>
    <text x="132" y="65" fill="#FC6255" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">-∞</text>
    <rect x="162" y="42" width="48" height="36" rx="4" fill="#FC6255" fill-opacity="0.2" stroke="#FC6255"/>
    <text x="186" y="65" fill="#FC6255" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">-∞</text>

    <!-- Row 3 -->
    <rect x="0" y="84" width="48" height="36" rx="4" fill="#58C4DD" fill-opacity="0.28" stroke="#58C4DD"/>
    <text x="24" y="107" fill="#ECECEC" font-family="Georgia, serif" font-size="14" text-anchor="middle">α₃₁</text>
    <rect x="54" y="84" width="48" height="36" rx="4" fill="#58C4DD" fill-opacity="0.28" stroke="#58C4DD"/>
    <text x="78" y="107" fill="#ECECEC" font-family="Georgia, serif" font-size="14" text-anchor="middle">α₃₂</text>
    <rect x="108" y="84" width="48" height="36" rx="4" fill="#58C4DD" fill-opacity="0.28" stroke="#58C4DD"/>
    <text x="132" y="107" fill="#ECECEC" font-family="Georgia, serif" font-size="14" text-anchor="middle">α₃₃</text>
    <rect x="162" y="84" width="48" height="36" rx="4" fill="#FC6255" fill-opacity="0.2" stroke="#FC6255"/>
    <text x="186" y="107" fill="#FC6255" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">-∞</text>

    <!-- Row 4 -->
    <rect x="0" y="126" width="48" height="36" rx="4" fill="#58C4DD" fill-opacity="0.28" stroke="#58C4DD"/>
    <text x="24" y="149" fill="#ECECEC" font-family="Georgia, serif" font-size="14" text-anchor="middle">α₄₁</text>
    <rect x="54" y="126" width="48" height="36" rx="4" fill="#58C4DD" fill-opacity="0.28" stroke="#58C4DD"/>
    <text x="78" y="149" fill="#ECECEC" font-family="Georgia, serif" font-size="14" text-anchor="middle">α₄₂</text>
    <rect x="108" y="126" width="48" height="36" rx="4" fill="#58C4DD" fill-opacity="0.28" stroke="#58C4DD"/>
    <text x="132" y="149" fill="#ECECEC" font-family="Georgia, serif" font-size="14" text-anchor="middle">α₄₃</text>
    <rect x="162" y="126" width="48" height="36" rx="4" fill="#58C4DD" fill-opacity="0.28" stroke="#58C4DD"/>
    <text x="186" y="149" fill="#ECECEC" font-family="Georgia, serif" font-size="14" text-anchor="middle">α₄₄</text>
  </g>

  <text x="792" y="344" fill="#FFFF00" font-family="Georgia, serif" font-weight="bold" font-size="15" text-anchor="middle">
    exp(-∞) = 0  після Softmax!
  </text>

  <!-- Sinusoidal Positional Encoding Wave Graphic -->
  <line x1="674" y1="364" x2="910" y2="364" stroke="#1e293b" stroke-width="1.5"/>
  <text x="792" y="386" fill="#5CD0B3" font-family="Georgia, serif" font-weight="bold" font-size="14" text-anchor="middle">
    Positional Encoding: sin / cos хвилі
  </text>
  <path d="M 678 422 Q 705 392, 732 422 T 786 422 T 840 422 T 894 422" fill="none" stroke="#58C4DD" stroke-width="2.2"/>
  <path d="M 678 422 Q 732 394, 786 422 T 894 422" fill="none" stroke="#FFFF00" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="792" y="448" fill="#8B949E" font-family="Georgia, serif" font-style="italic" font-size="12" text-anchor="middle">
    PE_{(pos, 2i)} = sin(pos / 10000^{2i/d})
  </text>
</svg>