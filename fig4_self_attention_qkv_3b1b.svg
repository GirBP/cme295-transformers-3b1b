<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad4" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </radialGradient>
    <filter id="glow4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#5CD0B3"/>
    </marker>
    <marker id="arrPurp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9A72AC"/>
    </marker>
  </defs>

  <!-- Background & Grid -->
  <rect width="960" height="470" rx="14" fill="url(#bgGrad4)" stroke="#1e293b" stroke-width="2"/>
  <g stroke="#58C4DD" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="75" x2="960" y2="75"/><line x1="0" y1="150" x2="960" y2="150"/>
    <line x1="0" y1="225" x2="960" y2="225"/><line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="0" y1="375" x2="960" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="470"/><line x1="320" y1="0" x2="320" y2="470"/>
    <line x1="480" y1="0" x2="480" y2="470"/><line x1="640" y1="0" x2="640" y2="470"/>
    <line x1="800" y1="0" x2="800" y2="470"/>
  </g>

  <!-- Title & 3b1b Color-Coded Master Equation -->
  <text x="34" y="40" fill="#ECECEC" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold">
    4. Матрична механіка Scaled Dot-Product Self-Attention (Q, K, V)
  </text>

  <!-- Glowing Equation Box -->
  <rect x="34" y="54" width="892" height="54" rx="10" fill="#0b101b" stroke="#58C4DD" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="480" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="bold" text-anchor="middle">
    <tspan fill="#ECECEC">Attention(</tspan>
    <tspan fill="#58C4DD">Q</tspan><tspan fill="#ECECEC">, </tspan>
    <tspan fill="#FFFF00">K</tspan><tspan fill="#ECECEC">, </tspan>
    <tspan fill="#83C167">V</tspan>
    <tspan fill="#ECECEC">) = softmax( </tspan>
    <tspan fill="#58C4DD">Q</tspan><tspan fill="#FFFF00">Kᵀ</tspan>
    <tspan fill="#5CD0B3"> / √d_k </tspan>
    <tspan fill="#ECECEC">) </tspan>
    <tspan fill="#83C167">V</tspan>
  </text>

  <!-- STEP-BY-STEP MATRIX MULTIPLICATION VISUALIZATION -->
  <g transform="translate(34, 124)">
    <!-- Matrix Q -->
    <rect x="0" y="18" width="124" height="140" rx="8" fill="#58C4DD" fill-opacity="0.18" stroke="#58C4DD" stroke-width="2.5" filter="url(#glow4)"/>
    <text x="62" y="72" fill="#58C4DD" font-family="Georgia, serif" font-weight="bold" font-size="28" text-anchor="middle">Q</text>
    <text x="62" y="98" fill="#ECECEC" font-family="monospace" font-size="13" text-anchor="middle">= X · W_Q</text>
    <text x="62" y="142" fill="#58C4DD" font-family="Georgia, serif" font-style="italic" font-size="15" text-anchor="middle">[L × d_k]</text>

    <!-- Multiply symbol -->
    <text x="144" y="96" fill="#ECECEC" font-family="Georgia, serif" font-size="28" text-anchor="middle">×</text>

    <!-- Matrix K^T -->
    <rect x="164" y="34" width="144" height="110" rx="8" fill="#FFFF00" fill-opacity="0.16" stroke="#FFFF00" stroke-width="2.5" filter="url(#glow4)"/>
    <text x="236" y="78" fill="#FFFF00" font-family="Georgia, serif" font-weight="bold" font-size="28" text-anchor="middle">Kᵀ</text>
    <text x="236" y="102" fill="#ECECEC" font-family="monospace" font-size="13" text-anchor="middle">= (X · W_K)ᵀ</text>
    <text x="236" y="130" fill="#FFFF00" font-family="Georgia, serif" font-style="italic" font-size="15" text-anchor="middle">[d_k × L]</text>

    <!-- Scale & Softmax Arrow -->
    <line x1="318" y1="88" x2="394" y2="88" stroke="#5CD0B3" stroke-width="2.5" marker-end="url(#arrTeal)"/>
    <text x="356" y="68" fill="#5CD0B3" font-family="Georgia, serif" font-weight="bold" font-size="14" text-anchor="middle">÷ √d_k</text>
    <text x="356" y="112" fill="#9A72AC" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">softmax</text>

    <!-- Attention Matrix A (L x L) Heatmap -->
    <rect x="406" y="18" width="150" height="140" rx="8" fill="#9A72AC" fill-opacity="0.2" stroke="#9A72AC" stroke-width="2.5"/>
    <text x="481" y="44" fill="#ECECEC" font-family="Georgia, serif" font-weight="bold" font-size="15" text-anchor="middle">Матриця ваг A</text>
    <!-- Mini 4x4 Heatmap inside A -->
    <g transform="translate(432, 54)">
      <rect x="0" y="0" width="22" height="18" fill="#58C4DD" fill-opacity="0.75"/><rect x="25" y="0" width="22" height="18" fill="#58C4DD" fill-opacity="0.2"/><rect x="50" y="0" width="22" height="18" fill="#58C4DD" fill-opacity="0.15"/><rect x="75" y="0" width="22" height="18" fill="#58C4DD" fill-opacity="0.1"/>
      <rect x="0" y="21" width="22" height="18" fill="#58C4DD" fill-opacity="0.2"/><rect x="25" y="21" width="22" height="18" fill="#FFFF00" fill-opacity="0.85"/><rect x="50" y="21" width="22" height="18" fill="#58C4DD" fill-opacity="0.25"/><rect x="75" y="21" width="22" height="18" fill="#58C4DD" fill-opacity="0.1"/>
      <rect x="0" y="42" width="22" height="18" fill="#58C4DD" fill-opacity="0.1"/><rect x="25" y="42" width="22" height="18" fill="#FFFF00" fill-opacity="0.9"/><rect x="50" y="42" width="22" height="18" fill="#58C4DD" fill-opacity="0.2"/><rect x="75" y="42" width="22" height="18" fill="#58C4DD" fill-opacity="0.15"/>
      <rect x="0" y="63" width="22" height="18" fill="#58C4DD" fill-opacity="0.15"/><rect x="25" y="63" width="22" height="18" fill="#58C4DD" fill-opacity="0.2"/><rect x="50" y="63" width="22" height="18" fill="#58C4DD" fill-opacity="0.3"/><rect x="75" y="63" width="22" height="18" fill="#83C167" fill-opacity="0.8"/>
    </g>
    <text x="481" y="150" fill="#9A72AC" font-family="Georgia, serif" font-style="italic" font-size="15" text-anchor="middle">[L × L], ∑_j α_{ij} = 1</text>

    <!-- Multiply symbol -->
    <text x="576" y="96" fill="#ECECEC" font-family="Georgia, serif" font-size="28" text-anchor="middle">×</text>

    <!-- Matrix V -->
    <rect x="596" y="18" width="124" height="140" rx="8" fill="#83C167" fill-opacity="0.18" stroke="#83C167" stroke-width="2.5" filter="url(#glow4)"/>
    <text x="658" y="72" fill="#83C167" font-family="Georgia, serif" font-weight="bold" font-size="28" text-anchor="middle">V</text>
    <text x="658" y="98" fill="#ECECEC" font-family="monospace" font-size="13" text-anchor="middle">= X · W_V</text>
    <text x="658" y="142" fill="#83C167" font-family="Georgia, serif" font-style="italic" font-size="15" text-anchor="middle">[L × d_v]</text>

    <!-- Equals symbol -->
    <text x="742" y="96" fill="#ECECEC" font-family="Georgia, serif" font-size="28" text-anchor="middle">=</text>

    <!-- Output Context Matrix Z -->
    <rect x="764" y="18" width="128" height="140" rx="8" fill="#5CD0B3" fill-opacity="0.22" stroke="#5CD0B3" stroke-width="2.5" filter="url(#glow4)"/>
    <text x="828" y="68" fill="#ECECEC" font-family="Georgia, serif" font-weight="bold" font-size="26" text-anchor="middle">Z</text>
    <text x="828" y="94" fill="#5CD0B3" font-family="sans-serif" font-size="12" text-anchor="middle">Контекстні</text>
    <text x="828" y="110" fill="#5CD0B3" font-family="sans-serif" font-size="12" text-anchor="middle">ембединги</text>
    <text x="828" y="142" fill="#5CD0B3" font-family="Georgia, serif" font-style="italic" font-size="15" text-anchor="middle">[L × d_v]</text>
  </g>

  <!-- BOTTOM CARDS: Why divide by sqrt(d_k) AND Multi-Head Attention -->
  <!-- Card 1: Why 1/sqrt(d_k) -->
  <rect x="34" y="302" width="435" height="144" rx="10" fill="#0b101b" fill-opacity="0.9" stroke="#5CD0B3" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="52" y="328" fill="#5CD0B3" font-family="Georgia, serif" font-size="16" font-weight="bold">
    Чому ділимо на √d_k? (Стабілізація дисперсії)
  </text>
  <text x="52" y="352" fill="#ECECEC" font-family="sans-serif" font-size="12.5">
    Якщо q_m, k_m ~ N(0, 1), то скалярний добуток q · k має:
  </text>
  <text x="250" y="382" fill="#FFFF00" font-family="Georgia, serif" font-weight="bold" font-size="17" text-anchor="middle">
    E[q · k] = 0,   Var(q · k) = d_k  ⇒  Var(q · k / √d_k) = 1
  </text>
  <text x="52" y="408" fill="#8B949E" font-family="sans-serif" font-size="12">
    Без ділення на √d_k при великих d_k значення q·k виштовхують
  </text>
  <text x="52" y="426" fill="#FC6255" font-family="sans-serif" font-weight="bold" font-size="12">
    Softmax у зону насичення (0 або 1), де градієнти ∂L/∂s → 0!
  </text>

  <!-- Card 2: Multi-Head Attention -->
  <rect x="491" y="302" width="435" height="144" rx="10" fill="#0b101b" fill-opacity="0.9" stroke="#9A72AC" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="509" y="328" fill="#9A72AC" font-family="Georgia, serif" font-size="16" font-weight="bold">
    Multi-Head Attention (H паралельних підпросторів)
  </text>
  <text x="708" y="358" fill="#ECECEC" font-family="Georgia, serif" font-weight="bold" font-size="15.5" text-anchor="middle">
    MultiHead(Q,K,V) = Concat(head₁, …, head_H) W_O
  </text>
  <g transform="translate(509, 372)">
    <rect x="0" y="0" width="90" height="32" rx="5" fill="#58C4DD" fill-opacity="0.2" stroke="#58C4DD"/>
    <text x="45" y="20" fill="#58C4DD" font-family="monospace" font-size="12" text-anchor="middle">head₁: Синтаксис</text>
    <rect x="102" y="0" width="95" height="32" rx="5" fill="#FFFF00" fill-opacity="0.2" stroke="#FFFF00"/>
    <text x="149" y="20" fill="#FFFF00" font-family="monospace" font-size="12" text-anchor="middle">head₂: Займенники</text>
    <rect x="209" y="0" width="90" height="32" rx="5" fill="#83C167" fill-opacity="0.2" stroke="#83C167"/>
    <text x="254" y="20" fill="#83C167" font-family="monospace" font-size="12" text-anchor="middle">head_H: Семантика</text>
    <rect x="312" y="0" width="86" height="32" rx="5" fill="#9A72AC" fill-opacity="0.25" stroke="#9A72AC" stroke-width="1.8"/>
    <text x="355" y="20" fill="#ECECEC" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">× W_O</text>
  </g>
  <text x="509" y="426" fill="#8B949E" font-family="sans-serif" font-size="12">
    Розмірність кожної голови: d_k = d_v = d_{model} / H (та сама ціна O(L²·d)).
  </text>
</svg>