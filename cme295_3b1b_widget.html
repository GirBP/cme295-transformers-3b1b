<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .cm-math {
      font-family: "CMU Serif", "Latin Modern Math", "Times New Roman", Georgia, serif;
      letter-spacing: 0.01em;
    }
    .manim-stage {
      background: radial-gradient(circle at 50% 42%, #131b2e 0%, #070a12 100%);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.75);
    }
    .glow-pill {
      box-shadow: 0 0 14px rgba(88, 196, 221, 0.25);
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0 select-none">
  <div class="py-1.5 space-y-2">
    <!-- Top Scene Navigation Bar -->
    <div class="flex flex-wrap items-center justify-between gap-1.5 pb-1.5 border-b border-[var(--card-border)] text-xs">
      <div class="flex flex-wrap items-center gap-1" id="sceneTabs">
        <button data-scene="0" class="scene-btn px-2.5 py-1 rounded-md font-medium bg-[var(--primary)] text-[var(--primary-foreground)] transition">1. Токенізація (BPE)</button>
        <button data-scene="1" class="scene-btn px-2.5 py-1 rounded-md font-medium bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] border border-[var(--card-border)] transition">2. Word2Vec ℝᵈ</button>
        <button data-scene="2" class="scene-btn px-2.5 py-1 rounded-md font-medium bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] border border-[var(--card-border)] transition">3. RNN vs Attention</button>
        <button data-scene="3" class="scene-btn px-2.5 py-1 rounded-md font-medium bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] border border-[var(--card-border)] transition">4. Q · K · V (Інтерактивно)</button>
        <button data-scene="4" class="scene-btn px-2.5 py-1 rounded-md font-medium bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] border border-[var(--card-border)] transition">5. Encoder–Decoder</button>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="playPauseBtn" class="px-2.5 py-1 rounded-md bg-[var(--card)] border border-[var(--card-border)] text-[var(--foreground)] font-mono hover:border-[var(--primary)] transition">⏸</button>
        <button id="restartBtn" class="px-2 py-1 rounded-md bg-[var(--card)] border border-[var(--card-border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition" title="Спочатку">↺</button>
      </div>
    </div>

    <!-- 3Blue1Brown Stage Container -->
    <div class="manim-stage relative w-full rounded-xl overflow-hidden border border-[#1e293b]">
      <!-- Top Floating 3b1b LaTeX Math Formula Banner -->
      <div class="flex items-center justify-between px-3.5 py-2 border-b border-white/10 bg-black/40 backdrop-blur-sm">
        <div id="mathBanner" class="cm-math text-sm sm:text-base text-[#ECECEC] truncate">
          <span class="text-[#58C4DD] font-bold">BPE</span>: &nbsp;
          <i>V</i><sub>t+1</sub> = <i>V</i><sub>t</sub> &cup; { argmax<sub>(a,b)</sub> freq(<i>a, b</i>) } &nbsp;&mdash;&nbsp;
          баланс між <span class="text-[#FFFF00]">|<i>V</i>|</span> та довжиною <span class="text-[#83C167]"><i>L</i></span>
        </div>
        <!-- Scene 4 Interactive Scaling Control (hidden on other scenes) -->
        <div id="scaleControl" class="hidden items-center gap-2 text-xs font-mono text-[#5CD0B3] shrink-0">
          <span>Масштаб &radic;d<sub>k</sub>:</span>
          <input id="scaleSlider" type="range" min="1" max="16" step="1" value="8" class="w-20 accent-[#58C4DD] cursor-pointer" />
          <span id="scaleVal" class="text-[#FFFF00] font-bold w-6">8.0</span>
        </div>
        <span id="timeBadge" class="text-xs font-mono px-2 py-0.5 rounded bg-white/5 text-[#58C4DD] border border-[#58C4DD]/30 shrink-0">00:16:56</span>
      </div>

      <!-- High-DPI 3b1b Canvas -->
      <canvas id="manimCanvas" class="w-full block cursor-pointer" height="275"></canvas>

      <!-- Bottom Interactive HUD & Timeline Bar -->
      <div class="flex items-center justify-between px-3.5 py-1.5 bg-black/55 border-t border-white/10 text-xs">
        <div id="sceneCaption" class="text-[#c9d1d9] truncate">
          <span class="text-[#58C4DD] font-semibold">3b1b Візуалізація:</span> Ітеративне злиття найчастіших пар символів у підслова.
        </div>
        <div id="interactiveBadge" class="text-[#FFFF00] font-mono shrink-0 ml-2">
          ✨ Клікніть для кроку
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('manimCanvas');
    const ctx = canvas.getContext('2d');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const restartBtn = document.getElementById('restartBtn');
    const mathBanner = document.getElementById('mathBanner');
    const timeBadge = document.getElementById('timeBadge');
    const sceneCaption = document.getElementById('sceneCaption');
    const interactiveBadge = document.getElementById('interactiveBadge');
    const scaleControl = document.getElementById('scaleControl');
    const scaleSlider = document.getElementById('scaleSlider');
    const scaleVal = document.getElementById('scaleVal');
    const sceneBtns = document.querySelectorAll('.scene-btn');

    // Authentic 3Blue1Brown Palette
    const C = {
      BLUE: '#58C4DD',
      DARK_BLUE: '#236B8E',
      YELLOW: '#FFFF00',
      GOLD: '#F0AC5F',
      GREEN: '#83C167',
      TEAL: '#5CD0B3',
      RED: '#FC6255',
      PURPLE: '#9A72AC',
      WHITE: '#ECECEC',
      MUTED: '#8B949E'
    };

    let currentScene = 0;
    let isPlaying = true;
    let t = 0;
    let lastTs = performance.now();
    let selectedTokenIdx = 3; // "it"
    let sqrtDk = 8.0;
    let word2vecMode = 0; // 0 = CBOW, 1 = Skip-gram

    const scenes = [
      {
        time: '00:16:56',
        math: `<span class="text-[#58C4DD] font-bold">Токенізація (BPE)</span>: &nbsp;<i>V</i><sub>k+1</sub> = <i>V</i><sub>k</sub> &cup; { argmax<sub>(a,b)</sub> freq(<i>a, b</i>) } &nbsp;&mdash;&nbsp; Компроміс <span class="text-[#FFFF00]">|<i>V</i>|</span> &harr; <span class="text-[#83C167]"><i>L</i></span>`,
        caption: `<span class="text-[#58C4DD] font-semibold">Byte-Pair Encoding:</span> Часті слова залишаються єдиним токеном, рідкісні розкладаються на морфеми без [UNK].`,
        badge: '✨ Клікніть по канвасу для злиття BPE'
      },
      {
        time: '00:37:27',
        math: `<span class="text-[#83C167] font-bold">Word2Vec</span>: &nbsp;<i>v<sub>i</sub> = E e<sub>i</sub> &in; &real;<sup>d</sup></i> &nbsp;&mdash;&nbsp; <span class="text-[#FFFF00]"><i>v&#8407;</i>(king) &minus; <i>v&#8407;</i>(man) + <i>v&#8407;</i>(woman) &approx; <i>v&#8407;</i>(queen)</span>`,
        caption: `<span class="text-[#83C167] font-semibold">Простір ембедингів ℝᵈ:</span> Ліворуч — нейромережа CBOW / Skip-gram; праворуч — паралелограм семантичних векторів.`,
        badge: '✨ Клікніть, щоб перемкнути CBOW ⇄ Skip-gram'
      },
      {
        time: '00:48:26',
        math: `<span class="text-[#FC6255] font-bold">RNN:</span> <i>h<sub>t</sub> = &tanh;(W<sub>h</sub>h<sub>t&minus;1</sub> + W<sub>x</sub>x<sub>t</sub>)</i> &nbsp;&nbsp;vs&nbsp;&nbsp; <span class="text-[#58C4DD] font-bold">Attention:</span> прямий доступ <i>O</i>(1) без затухання градієнта`,
        caption: `<span class="text-[#FFFF00] font-semibold">Пляшкове горло RNN проти Attention:</span> У RNN сигнал затухає за O(L) кроків; Attention з'єднує "it" → "trophy" напряму.`,
        badge: '✨ Потік частинок показує силу зв’язку α'
      },
      {
        time: '00:59:54',
        math: `Attention(<span class="text-[#58C4DD] font-bold"><i>Q</i></span>, <span class="text-[#FFFF00] font-bold"><i>K</i></span>, <span class="text-[#83C167] font-bold"><i>V</i></span>) = softmax( <span class="text-[#58C4DD] font-bold"><i>Q</i></span><span class="text-[#FFFF00] font-bold"><i>K</i><sup>T</sup></span> / <span class="text-[#5CD0B3]">&radic;<i>d<sub>k</sub></i></span> ) <span class="text-[#83C167] font-bold"><i>V</i></span>`,
        caption: `<span class="text-[#FFFF00] font-semibold">Інтерактивний Self-Attention:</span> Клікніть на токен ліворуч або змініть масштаб √d_k угорі, щоб побачити насичення Softmax!`,
        badge: '👆 Клікніть на будь-який токен Query ліворуч'
      },
      {
        time: '01:09:35',
        math: `<span class="text-[#5CD0B3] font-bold">Encoder</span> (<i>K<sub>enc</sub>, V<sub>enc</sub></i>) &rarr; <span class="text-[#9A72AC] font-bold">Decoder</span>: &nbsp;softmax( <i>QK</i><sup>T</sup> / &radic;<i>d<sub>k</sub></i> + <span class="text-[#FC6255]"><i>M</i><sub>causal</sub>(&minus;&infin;)</span> ) <i>V</i>`,
        caption: `<span class="text-[#5CD0B3] font-semibold">Архітектура Transformer:</span> Двонапрямний Encoder передає K, V у Cross-Attention декодера з трикутною маскою -∞.`,
        badge: '✨ Потік тензорів крізь Encoder та Decoder'
      }
    ];

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = 275 * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function setScene(idx) {
      currentScene = idx;
      t = 0;
      sceneBtns.forEach((btn, i) => {
        btn.className = (i === idx)
          ? 'scene-btn px-2.5 py-1 rounded-md font-medium bg-[var(--primary)] text-[var(--primary-foreground)] transition'
          : 'scene-btn px-2.5 py-1 rounded-md font-medium bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] border border-[var(--card-border)] transition';
      });
      mathBanner.innerHTML = scenes[idx].math;
      timeBadge.textContent = scenes[idx].time;
      sceneCaption.innerHTML = scenes[idx].caption;
      interactiveBadge.textContent = scenes[idx].badge;
      if (idx === 3) {
        scaleControl.classList.remove('hidden');
        scaleControl.classList.add('flex');
        timeBadge.classList.add('hidden');
      } else {
        scaleControl.classList.add('hidden');
        scaleControl.classList.remove('flex');
        timeBadge.classList.remove('hidden');
      }
    }

    sceneBtns.forEach(btn => {
      btn.addEventListener('click', () => setScene(parseInt(btn.dataset.scene, 10)));
    });

    scaleSlider.addEventListener('input', (e) => {
      sqrtDk = parseFloat(e.target.value);
      scaleVal.textContent = sqrtDk.toFixed(1);
    });

    playPauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playPauseBtn.textContent = isPlaying ? '⏸' : '▶';
    });

    restartBtn.addEventListener('click', () => {
      t = 0;
      if (!isPlaying) {
        isPlaying = true;
        playPauseBtn.textContent = '⏸';
      }
    });

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      if (currentScene === 3) {
        const tokens = ['The', 'robot', 'picked', 'it', 'up'];
        tokens.forEach((_, i) => {
          const ty = 54 + i * 44;
          if (x >= 22 && x <= 148 && y >= ty - 16 && y <= ty + 16) {
            selectedTokenIdx = i;
          }
        });
      } else if (currentScene === 1) {
        word2vecMode = (word2vecMode + 1) % 2;
      } else {
        t += 1.4;
      }
    });

    // 3Blue1Brown Drawing Helpers with Neon Glow
    function drawCoordinatePlane(w, h) {
      ctx.save();
      ctx.strokeStyle = 'rgba(88, 196, 221, 0.065)';
      ctx.lineWidth = 1;
      const step = 38;
      for (let x = step; x < w; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = step; y < h; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }
      ctx.restore();
    }

    function drawGlowBox(x, y, w, h, r, fill, stroke, glowColor = null, lineWidth = 1.8) {
      ctx.save();
      if (glowColor) {
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 14;
      }
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
      ctx.restore();
    }

    function drawGlowArrow(x1, y1, x2, y2, color, width = 2.2, alpha = 1, glow = true) {
      ctx.save();
      ctx.globalAlpha = alpha;
      if (glow) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
      }
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      const angle = Math.atan2(y2 - y1, x2 - x1);
      const head = 7 + width * 1.2;
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - head * Math.cos(angle - Math.PI / 6), y2 - head * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(x2 - head * Math.cos(angle + Math.PI / 6), y2 - head * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawBezierBeamWithParticle(x1, y1, cx1, cy1, cx2, cy2, x2, y2, color, weight, phase) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.bezierCurveTo(cx1, cy1, cx2, cy2, x2, y2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1 + weight * 7;
      ctx.globalAlpha = 0.18 + weight * 0.82;
      if (weight > 0.25) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 12;
      }
      ctx.stroke();

      // Animated glowing photon traveling along the cubic Bezier curve
      if (weight > 0.12) {
        const u = (phase % 1 + 1) % 1;
        const inv = 1 - u;
        const px = inv*inv*inv*x1 + 3*inv*inv*u*cx1 + 3*inv*u*u*cx2 + u*u*u*x2;
        const py = inv*inv*inv*y1 + 3*inv*inv*u*cy1 + 3*inv*u*u*cy2 + u*u*u*y2;
        ctx.globalAlpha = Math.min(1, weight * 1.6);
        ctx.shadowColor = color;
        ctx.shadowBlur = 14;
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(px, py, 2.2 + weight * 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // SCENE 0: Tokenization & BPE Merge Tree
    function renderScene0(w, h) {
      const tiers = [
        {
          title: 'Word-level',
          desc: '|V| > 500k • OOV → [UNK]',
          color: C.RED,
          tokens: ['Transformers', 'are', '[UNK]'],
          y: 48
        },
        {
          title: 'Character-level',
          desc: '|V| ≈ 256 • L занадто довга',
          color: C.GOLD,
          tokens: ['u', 'n', 'a', 'f', 'f', 'a', 'b', 'l', 'e'],
          y: 132
        },
        {
          title: 'Subword (BPE)',
          desc: '|V| ≈ 50k–100k • Оптимум LLM',
          color: C.BLUE,
          tokens: ['un', '##aff', '##able'],
          y: 216
        }
      ];

      tiers.forEach((tier, idx) => {
        ctx.fillStyle = tier.color;
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText(tier.title, 24, tier.y - 6);
        ctx.fillStyle = C.MUTED;
        ctx.font = '11px sans-serif';
        ctx.fillText(tier.desc, 24, tier.y + 12);

        let curX = 215;
        tier.tokens.forEach((tok, j) => {
          const floatY = idx === 2 ? Math.sin(t * 2.6 - j * 0.9) * 2.5 : 0;
          ctx.font = 'bold 13px monospace';
          const tw = Math.max(30, ctx.measureText(tok).width + 20);
          const isGlow = idx === 2 || tok === '[UNK]';
          drawGlowBox(
            curX,
            tier.y - 16 + floatY,
            tw,
            30,
            6,
            idx === 2 ? 'rgba(88,196,221,0.18)' : 'rgba(255,255,255,0.04)',
            tier.color,
            isGlow ? tier.color : null,
            idx === 2 ? 2 : 1.4
          );
          ctx.fillStyle = tok === '[UNK]' ? C.YELLOW : C.WHITE;
          ctx.fillText(tok, curX + 10, tier.y + 3 + floatY);
          curX += tw + 7;
        });
      });

      // Right Side: Animated BPE Merge Tree Card
      if (w > 590) {
        const rx = w - 255;
        drawGlowBox(rx, 20, 232, 232, 10, 'rgba(11, 16, 27, 0.9)', 'rgba(88,196,221,0.4)', C.BLUE, 1.5);
        ctx.fillStyle = C.YELLOW;
        ctx.font = 'bold 12.5px Georgia, serif';
        ctx.fillText('Ітеративне злиття BPE:', rx + 16, 44);

        const stages = [
          { label: '0. ["l", "o", "w", "e", "r"]', col: C.MUTED },
          { label: '1. ("e","r") → ["l","o","w","er"]', col: C.BLUE },
          { label: '2. ("l","o") → ["lo","w","er"]', col: C.TEAL },
          { label: '3. ("lo","w") → ["low", "er"]', col: C.GREEN },
          { label: '✓ ID токенів: [841, 92]', col: C.YELLOW }
        ];
        const activeIdx = Math.floor((t * 0.95) % stages.length);

        stages.forEach((st, i) => {
          const sy = 76 + i * 36;
          const isAct = i === activeIdx;
          if (isAct) {
            drawGlowBox(rx + 10, sy - 16, 212, 26, 5, 'rgba(88,196,221,0.16)', st.col, st.col, 1.4);
          }
          ctx.fillStyle = isAct ? st.col : 'rgba(236,236,236,0.45)';
          ctx.font = isAct ? 'bold 11.5px monospace' : '11px monospace';
          ctx.fillText(st.label, rx + 18, sy + 1);
        });
      }
    }

    // SCENE 1: Word2Vec Semantic Vector Space R^d
    function renderScene1(w, h) {
      // Left: CBOW vs Skip-gram neural diagram
      drawGlowBox(22, 18, 276, 238, 10, 'rgba(11, 16, 27, 0.88)', 'rgba(131,193,103,0.4)', null, 1.4);
      const isCBOW = word2vecMode === 0;

      ctx.fillStyle = isCBOW ? C.BLUE : C.YELLOW;
      ctx.font = 'bold 13px Georgia, serif';
      ctx.fillText(isCBOW ? 'CBOW: Контекст → Центральне w_t' : 'Skip-gram: Центральне w_t → Контекст', 36, 42);

      const ctxLabels = ['w(t-2)', 'w(t-1)', 'w(t+1)', 'w(t+2)'];
      const centerY = 144;
      const leftX = 42;
      const rightX = 212;

      ctxLabels.forEach((lbl, i) => {
        const cy = 72 + i * 46;
        const boxX = isCBOW ? leftX : rightX;
        drawGlowBox(boxX, cy - 13, 62, 26, 5, 'rgba(88,196,221,0.14)', C.BLUE, null, 1.4);
        ctx.fillStyle = C.WHITE;
        ctx.font = '11.5px Georgia, serif';
        ctx.fillText(lbl, boxX + 11, cy + 4);

        if (isCBOW) {
          drawBezierBeamWithParticle(leftX + 64, cy, 145, cy, 165, centerY, rightX - 2, centerY, C.BLUE, 0.55, t * 0.9 + i * 0.2);
        } else {
          drawBezierBeamWithParticle(leftX + 64, centerY, 140, centerY, 155, cy, rightX - 2, cy, C.YELLOW, 0.55, t * 0.9 + i * 0.2);
        }
      });

      const targetX = isCBOW ? rightX : leftX;
      drawGlowBox(targetX, centerY - 18, 62, 36, 7, 'rgba(255,255,0,0.2)', C.YELLOW, C.YELLOW, 2);
      ctx.fillStyle = C.YELLOW;
      ctx.font = 'bold 14px Georgia, serif';
      ctx.fillText('w(t)', targetX + 16, centerY + 5);

      // Right: 3b1b Parallelogram in R^d
      const ox = 345;
      const oy = 232;
      drawGlowArrow(ox, oy, Math.min(w - 28, ox + 370), oy, C.MUTED, 1.5, 0.7, false);
      drawGlowArrow(ox, oy, ox, 26, C.MUTED, 1.5, 0.7, false);

      ctx.fillStyle = C.MUTED;
      ctx.font = 'italic 12px Georgia, serif';
      ctx.fillText('Вісь статі →', ox + 245, oy + 18);
      ctx.fillText('↑ Королівський статус', ox + 10, 38);

      const pMan   = { x: ox + 65,  y: oy - 44 };
      const pKing  = { x: ox + 102, y: oy - 162 };
      const pWoman = { x: ox + 225, y: oy - 38 };
      const pQueen = { x: ox + 262, y: oy - 156 };

      // Glowing Royalty Arrows
      drawGlowArrow(pMan.x, pMan.y, pKing.x, pKing.y, C.YELLOW, 2.8, 0.95, true);
      drawGlowArrow(pWoman.x, pWoman.y, pQueen.x, pQueen.y, C.YELLOW, 2.8, 0.95, true);

      // Dashed Gender Shift Vectors
      ctx.save();
      ctx.setLineDash([5, 4]);
      drawGlowArrow(pMan.x, pMan.y, pWoman.x, pWoman.y, C.TEAL, 2, 0.85, false);
      drawGlowArrow(pKing.x, pKing.y, pQueen.x, pQueen.y, C.TEAL, 2, 0.85, false);
      ctx.restore();

      const nodes = [
        { p: pMan,   c: C.BLUE,   lbl: 'man' },
        { p: pKing,  c: C.YELLOW, lbl: 'king' },
        { p: pWoman, c: C.GREEN,  lbl: 'woman' },
        { p: pQueen, c: C.PURPLE, lbl: 'queen' }
      ];
      nodes.forEach(n => {
        ctx.save();
        ctx.shadowColor = n.c;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(n.p.x, n.p.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = n.c;
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = C.WHITE;
        ctx.font = 'bold 14px Georgia, serif';
        ctx.fillText(n.lbl, n.p.x + 10, n.p.y + 4);
      });
    }

    // SCENE 2: RNN Sequential Bottleneck vs Parallel Self-Attention
    function renderScene2(w, h) {
      const words = ['The', 'trophy', "didn't", 'fit', 'because', 'it'];
      const startX = 62;
      const gap = Math.min(118, (w - 125) / 5.1);

      // Top: RNN Sequential Chain
      ctx.fillStyle = C.RED;
      ctx.font = 'bold 12.5px sans-serif';
      ctx.fillText('1. RNN / LSTM: Послідовна передача стану h₁ → h₂ → … → h₆ (інформація про початок згасає)', 24, 28);

      const activeStep = (t * 1.6) % 6;
      words.forEach((word, i) => {
        const cx = startX + i * gap;
        const cy = 74;
        const fade = Math.max(0.14, 0.85 - i * 0.14);
        drawGlowBox(cx - 26, cy - 17, 52, 34, 8, `rgba(252, 98, 85, ${fade * 0.4})`, C.RED, i === Math.floor(activeStep) ? C.RED : null, 1.8);
        ctx.fillStyle = C.WHITE;
        ctx.font = 'bold 13px Georgia, serif';
        ctx.fillText(`h${i + 1}`, cx - 8, cy + 5);

        ctx.fillStyle = i === 1 ? C.YELLOW : C.MUTED;
        ctx.font = i === 1 ? 'bold 12px monospace' : '11.5px monospace';
        ctx.fillText(word, cx - 22, cy + 34);

        if (i < words.length - 1) {
          drawGlowArrow(cx + 28, cy, cx + gap - 28, cy, C.RED, 2, 0.75, false);
        }
      });

      // Bottom: Self-Attention Direct Parallel Routing
      ctx.fillStyle = C.BLUE;
      ctx.font = 'bold 12.5px sans-serif';
      ctx.fillText('2. Self-Attention: Прямий зв’язок O(1) — займенник "it" напряму звертається до "trophy" (α = 0.64)', 24, 148);

      const weights = [0.05, 0.64, 0.05, 0.09, 0.05, 0.12];
      const itX = startX + 5 * gap;
      const baseY = 232;

      words.forEach((word, i) => {
        const cx = startX + i * gap;
        const wgt = weights[i];
        const midX = (itX + cx) / 2;
        const peakY = baseY - 22 - (5 - i) * 14;

        drawBezierBeamWithParticle(
          itX, baseY - 16,
          midX, peakY,
          midX, peakY,
          cx, baseY - 16,
          i === 1 ? C.YELLOW : C.BLUE,
          wgt,
          t * 0.85 + i * 0.15
        );

        const isHi = i === 1 || i === 5;
        const col = i === 1 ? C.YELLOW : (i === 5 ? C.BLUE : 'rgba(88,196,221,0.45)');
        drawGlowBox(
          cx - 34,
          baseY - 15,
          68,
          30,
          7,
          i === 1 ? 'rgba(255,255,0,0.22)' : 'rgba(88,196,221,0.15)',
          col,
          isHi ? col : null,
          isHi ? 2.2 : 1.3
        );
        ctx.fillStyle = i === 1 ? C.YELLOW : C.WHITE;
        ctx.font = isHi ? 'bold 12.5px monospace' : '11.5px monospace';
        ctx.fillText(word, cx - 24, baseY + 4);
      });
    }

    // SCENE 3: Interactive Scaled Dot-Product Self-Attention (Q, K, V) with live sqrt(d_k) slider!
    function renderScene3(w, h) {
      const tokens = ['The', 'robot', 'picked', 'it', 'up'];
      // Raw unscaled dot products q_i · k_j (for scale = 8.0)
      const rawLogits = [
        [10.5,  8.8,  2.0,  1.2,  1.2],
        [ 4.2, 11.4,  6.1,  2.1,  2.1],
        [ 1.8,  8.2, 10.6,  4.0,  4.5],
        [ 2.5, 13.5,  5.2,  4.1,  2.4], // "it" strongly matches "robot"
        [ 1.5,  5.4, 11.8,  4.2,  6.8]
      ];

      // Compute live softmax(q_i · k_j / sqrtDk)
      const logits = rawLogits[selectedTokenIdx].map(s => s / (sqrtDk / 4.0));
      const maxL = Math.max(...logits);
      const exps = logits.map(l => Math.exp(l - maxL));
      const sumExp = exps.reduce((a, b) => a + b, 0);
      const weights = exps.map(e => e / sumExp);

      // Column 1: Query Tokens
      ctx.fillStyle = C.BLUE;
      ctx.font = 'bold 12px monospace';
      ctx.fillText('1. Запит Query (qᵢ)', 24, 24);

      const selY = 54 + selectedTokenIdx * 44;
      tokens.forEach((tok, i) => {
        const y = 54 + i * 44;
        const isSel = i === selectedTokenIdx;
        drawGlowBox(
          24,
          y - 15,
          122,
          30,
          7,
          isSel ? 'rgba(88,196,221,0.28)' : 'rgba(11,16,27,0.9)',
          isSel ? C.BLUE : 'rgba(88,196,221,0.3)',
          isSel ? C.BLUE : null,
          isSel ? 2.2 : 1.2
        );
        ctx.fillStyle = isSel ? C.WHITE : C.MUTED;
        ctx.font = isSel ? 'bold 13px monospace' : '12px monospace';
        ctx.fillText((isSel ? '▶ q(' : '  q(') + tok + ')', 32, y + 4);
      });

      // Column 2: Keys & Softmax Weights
      const col2X = Math.min(260, w * 0.36);
      ctx.fillStyle = C.YELLOW;
      ctx.font = 'bold 12px monospace';
      ctx.fillText('2. Ключі Key (kⱼ) та ваги αᵢⱼ', col2X, 24);

      tokens.forEach((tok, j) => {
        const ky = 54 + j * 44;
        const wgt = weights[j];
        const beamCol = wgt > 0.35 ? C.YELLOW : C.BLUE;

        drawBezierBeamWithParticle(
          146, selY,
          200, selY,
          col2X - 50, ky,
          col2X, ky,
          beamCol,
          wgt,
          t * 0.95 + j * 0.18
        );

        drawGlowBox(col2X, ky - 15, 168, 30, 7, 'rgba(11,16,27,0.92)', wgt > 0.35 ? C.YELLOW : 'rgba(255,255,0,0.35)', wgt > 0.45 ? C.YELLOW : null, 1.5);
        drawGlowBox(col2X + 3, ky - 12, Math.max(6, wgt * 162), 24, 5, wgt > 0.35 ? 'rgba(255,255,0,0.28)' : 'rgba(88,196,221,0.2)', null);

        ctx.fillStyle = C.WHITE;
        ctx.font = '12px monospace';
        ctx.fillText(`k(${tok})`, col2X + 10, ky + 4);
        ctx.fillStyle = C.YELLOW;
        ctx.font = 'bold 12.5px monospace';
        ctx.fillText(`${(wgt * 100).toFixed(1)}%`, col2X + 114, ky + 4);
      });

      // Column 3: Values V Weighted Sum -> Context Vector z_i
      const col3X = Math.min(500, w * 0.68);
      if (w > 530) {
        ctx.fillStyle = C.GREEN;
        ctx.font = 'bold 12px monospace';
        ctx.fillText('3. Вихід zᵢ = ∑ αᵢⱼ vⱼ', col3X, 24);

        const outY = 142;
        tokens.forEach((_, j) => {
          const ky = 54 + j * 44;
          const wgt = weights[j];
          drawBezierBeamWithParticle(
            col2X + 168, ky,
            col2X + 210, ky,
            col3X - 25, outY,
            col3X + 10, outY,
            C.GREEN,
            wgt,
            t * 0.95 + j * 0.15
          );
        });

        const cardW = Math.min(205, w - col3X - 22);
        drawGlowBox(col3X + 10, outY - 54, cardW, 108, 10, 'rgba(131,193,103,0.15)', C.GREEN, C.GREEN, 2);
        ctx.fillStyle = C.WHITE;
        ctx.font = 'bold 14px Georgia, serif';
        ctx.fillText(`Вектор z("${tokens[selectedTokenIdx]}")`, col3X + 22, outY - 26);

        const topIdx = weights.indexOf(Math.max(...weights));
        ctx.fillStyle = C.YELLOW;
        ctx.font = 'bold 12px monospace';
        ctx.fillText(`Макс: "${tokens[topIdx]}" (${(weights[topIdx] * 100).toFixed(0)}%)`, col3X + 22, outY - 2);

        ctx.fillStyle = sqrtDk <= 3 ? C.RED : C.TEAL;
        ctx.font = '11px sans-serif';
        ctx.fillText(
          sqrtDk <= 3 ? '⚠ Насичення Softmax (градієнт → 0)' : '✓ Стабільна дисперсія (Var ≈ 1)',
          col3X + 22,
          outY + 22
        );
        ctx.fillStyle = C.MUTED;
        ctx.font = '11px monospace';
        ctx.fillText(`Масштаб: 1/√d_k = 1/${sqrtDk.toFixed(0)}`, col3X + 22, outY + 40);
      }
    }

    // SCENE 4: Full Transformer Architecture (Encoder-Decoder & Causal Mask -inf)
    function renderScene4(w, h) {
      const encX = 24;
      const boxW = Math.min(208, w * 0.29);

      // Encoder Stack
      drawGlowBox(encX, 16, boxW, 242, 10, 'rgba(92, 208, 179, 0.07)', C.TEAL, C.TEAL, 1.8);
      ctx.fillStyle = C.TEAL;
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('ENCODER (Двонапрямний)', encX + 14, 38);

      const encBlocks = [
        { name: 'Input + sin/cos PE', y: 214, c: C.BLUE },
        { name: 'Multi-Head Self-Attention', y: 162, c: C.TEAL },
        { name: 'Add & LayerNorm', y: 118, c: C.BLUE },
        { name: 'Feed-Forward (FFN)', y: 68, c: C.GREEN }
      ];
      encBlocks.forEach(b => {
        drawGlowBox(encX + 12, b.y, boxW - 24, 32, 6, 'rgba(11,16,27,0.92)', b.c, null, 1.4);
        ctx.fillStyle = C.WHITE;
        ctx.font = '11.5px monospace';
        ctx.fillText(b.name, encX + 22, b.y + 20);
      });

      // Decoder Stack
      const decX = encX + boxW + 46;
      drawGlowBox(decX, 16, boxW + 18, 242, 10, 'rgba(154, 114, 172, 0.09)', C.PURPLE, C.PURPLE, 1.8);
      ctx.fillStyle = C.PURPLE;
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('DECODER (Авторегресійний)', decX + 14, 38);

      const decBlocks = [
        { name: '1. Masked Self-Attention (-∞)', y: 214, c: C.RED },
        { name: '2. Cross-Attention (Q, K_enc, V_enc)', y: 156, c: C.YELLOW },
        { name: '3. Feed-Forward + Add & Norm', y: 106, c: C.GREEN },
        { name: 'Linear + Softmax → P(w_t+1)', y: 58, c: C.PURPLE }
      ];
      decBlocks.forEach(b => {
        drawGlowBox(decX + 12, b.y, boxW - 6, 32, 6, 'rgba(11,16,27,0.92)', b.c, b.c === C.YELLOW ? C.YELLOW : null, 1.5);
        ctx.fillStyle = C.WHITE;
        ctx.font = '11px monospace';
        ctx.fillText(b.name, decX + 18, b.y + 20);
      });

      // Animated K, V Bridge from Encoder Top to Decoder Cross-Attention
      drawBezierBeamWithParticle(
        encX + boxW, 84,
        encX + boxW + 32, 84,
        decX - 24, 172,
        decX + 12, 172,
        C.YELLOW,
        0.85,
        t * 0.9
      );
      ctx.fillStyle = C.YELLOW;
      ctx.font = 'bold 12px Georgia, serif';
      ctx.fillText('K, V', encX + boxW + 10, 122);

      // Right: Upper-Triangular Causal Mask (-inf)
      const maskX = decX + boxW + 38;
      if (w - maskX > 165) {
        drawGlowBox(maskX - 8, 16, w - maskX - 12, 242, 10, 'rgba(11,16,27,0.9)', 'rgba(252,98,85,0.45)', null, 1.4);
        ctx.fillStyle = C.RED;
        ctx.font = 'bold 12.5px Georgia, serif';
        ctx.fillText('Causal Mask (Look-Ahead):', maskX + 6, 38);

        const cell = 34;
        const toks = ['<s>', 'Я', 'вчу', 'LLM'];
        for (let r = 0; r < 4; r++) {
          ctx.fillStyle = C.MUTED;
          ctx.font = '11px monospace';
          ctx.fillText(toks[r], maskX + 6, 76 + r * cell);
          for (let c = 0; c < 4; c++) {
            const cx = maskX + 38 + c * cell;
            const cy = 56 + r * cell;
            const masked = c > r;
            drawGlowBox(
              cx,
              cy,
              cell - 4,
              cell - 4,
              5,
              masked ? 'rgba(252, 98, 85, 0.2)' : 'rgba(88, 196, 221, 0.24)',
              masked ? C.RED : C.BLUE,
              null,
              1.2
            );
            ctx.fillStyle = masked ? C.RED : C.WHITE;
            ctx.font = 'bold 11px monospace';
            ctx.fillText(masked ? '-∞' : 'α', cx + (masked ? 6 : 11), cy + 19);
          }
        }
        ctx.fillStyle = C.YELLOW;
        ctx.font = 'bold 11.5px Georgia, serif';
        ctx.fillText('exp(-∞) = 0 після Softmax!', maskX + 12, 218);
        ctx.fillStyle = C.MUTED;
        ctx.font = '10.5px sans-serif';
        ctx.fillText('Блокує підглядання у майбутнє', maskX + 12, 238);
      }
    }

    function animate(now) {
      const dt = (now - lastTs) / 1000;
      lastTs = now;
      if (isPlaying) t += dt;

      const w = canvas.width / (window.devicePixelRatio || 1);
      const h = canvas.height / (window.devicePixelRatio || 1);

      ctx.clearRect(0, 0, w, h);
      drawCoordinatePlane(w, h);

      if (currentScene === 0) renderScene0(w, h);
      else if (currentScene === 1) renderScene1(w, h);
      else if (currentScene === 2) renderScene2(w, h);
      else if (currentScene === 3) renderScene3(w, h);
      else if (currentScene === 4) renderScene4(w, h);

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
