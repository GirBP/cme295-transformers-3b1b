<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </radialGradient>
    <filter id="glow2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#FFFF00"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#5CD0B3"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#58C4DD"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#83C167"/>
    </marker>
  </defs>

  <!-- Background & Grid -->
  <rect width="960" height="450" rx="14" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="2"/>
  <g stroke="#58C4DD" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="75" x2="960" y2="75"/><line x1="0" y1="150" x2="960" y2="150"/>
    <line x1="0" y1="225" x2="960" y2="225"/><line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="0" y1="375" x2="960" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="450"/><line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/><line x1="640" y1="0" x2="640" y2="450"/>
    <line x1="800" y1="0" x2="800" y2="450"/>
  </g>

  <!-- Title -->
  <text x="34" y="42" fill="#ECECEC" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold">
    2. Word2Vec: Від One-Hot векторів до семантичного простору ℝᵈ (CBOW та Skip-gram)
  </text>
  <text x="34" y="65" fill="#83C167" font-family="Georgia, serif" font-style="italic" font-size="15">
    Матриця ембедингів E ∈ ℝ^{d × |V|} перетворює ортогональні індекси на вектори зі змістом (00:37:27)
  </text>

  <!-- LEFT PANEL: CBOW vs Skip-gram Architecture -->
  <rect x="28" y="84" width="430" height="340" rx="10" fill="#0b101b" fill-opacity="0.88" stroke="#236B8E" stroke-width="1.5"/>

  <!-- CBOW Half -->
  <text x="48" y="114" fill="#58C4DD" font-family="Georgia, serif" font-size="16" font-weight="bold">
    CBOW (Контекст → Слово)
  </text>
  <g transform="translate(48, 128)">
    <rect x="0" y="0" width="66" height="28" rx="5" fill="#58C4DD" fill-opacity="0.16" stroke="#58C4DD" stroke-width="1.5"/>
    <text x="33" y="19" fill="#ECECEC" font-family="Georgia, serif" font-style="italic" font-size="14" text-anchor="middle">w_{t-2}</text>

    <rect x="0" y="38" width="66" height="28" rx="5" fill="#58C4DD" fill-opacity="0.16" stroke="#58C4DD" stroke-width="1.5"/>
    <text x="33" y="57" fill="#ECECEC" font-family="Georgia, serif" font-style="italic" font-size="14" text-anchor="middle">w_{t-1}</text>

    <rect x="0" y="76" width="66" height="28" rx="5" fill="#58C4DD" fill-opacity="0.16" stroke="#58C4DD" stroke-width="1.5"/>
    <text x="33" y="95" fill="#ECECEC" font-family="Georgia, serif" font-style="italic" font-size="14" text-anchor="middle">w_{t+1}</text>

    <rect x="0" y="114" width="66" height="28" rx="5" fill="#58C4DD" fill-opacity="0.16" stroke="#58C4DD" stroke-width="1.5"/>
    <text x="33" y="133" fill="#ECECEC" font-family="Georgia, serif" font-style="italic" font-size="14" text-anchor="middle">w_{t+2}</text>

    <line x1="70" y1="14" x2="122" y2="66" stroke="#58C4DD" stroke-width="1.6" marker-end="url(#arrB)"/>
    <line x1="70" y1="52" x2="122" y2="69" stroke="#58C4DD" stroke-width="1.6" marker-end="url(#arrB)"/>
    <line x1="70" y1="90" x2="122" y2="73" stroke="#58C4DD" stroke-width="1.6" marker-end="url(#arrB)"/>
    <line x1="70" y1="128" x2="122" y2="76" stroke="#58C4DD" stroke-width="1.6" marker-end="url(#arrB)"/>

    <rect x="128" y="52" width="58" height="38" rx="7" fill="#FFFF00" fill-opacity="0.2" stroke="#FFFF00" stroke-width="2" filter="url(#glow2)"/>
    <text x="157" y="76" fill="#FFFF00" font-family="Georgia, serif" font-weight="bold" font-style="italic" font-size="16" text-anchor="middle">w_t</text>
  </g>

  <!-- Divider -->
  <line x1="244" y1="98" x2="244" y2="285" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Skip-gram Half -->
  <text x="260" y="114" fill="#FFFF00" font-family="Georgia, serif" font-size="16" font-weight="bold">
    Skip-gram (Слово → Контекст)
  </text>
  <g transform="translate(260, 128)">
    <rect x="0" y="52" width="58" height="38" rx="7" fill="#FFFF00" fill-opacity="0.2" stroke="#FFFF00" stroke-width="2" filter="url(#glow2)"/>
    <text x="29" y="76" fill="#FFFF00" font-family="Georgia, serif" font-weight="bold" font-style="italic" font-size="16" text-anchor="middle">w_t</text>

    <line x1="62" y1="66" x2="112" y2="16" stroke="#FFFF00" stroke-width="1.6" marker-end="url(#arrY)"/>
    <line x1="62" y1="69" x2="112" y2="52" stroke="#FFFF00" stroke-width="1.6" marker-end="url(#arrY)"/>
    <line x1="62" y1="73" x2="112" y2="90" stroke="#FFFF00" stroke-width="1.6" marker-end="url(#arrY)"/>
    <line x1="62" y1="76" x2="112" y2="126" stroke="#FFFF00" stroke-width="1.6" marker-end="url(#arrY)"/>

    <rect x="118" y="0" width="66" height="28" rx="5" fill="#83C167" fill-opacity="0.16" stroke="#83C167" stroke-width="1.5"/>
    <text x="151" y="19" fill="#ECECEC" font-family="Georgia, serif" font-style="italic" font-size="14" text-anchor="middle">w_{t-2}</text>

    <rect x="118" y="38" width="66" height="28" rx="5" fill="#83C167" fill-opacity="0.16" stroke="#83C167" stroke-width="1.5"/>
    <text x="151" y="57" fill="#ECECEC" font-family="Georgia, serif" font-style="italic" font-size="14" text-anchor="middle">w_{t-1}</text>

    <rect x="118" y="76" width="66" height="28" rx="5" fill="#83C167" fill-opacity="0.16" stroke="#83C167" stroke-width="1.5"/>
    <text x="151" y="95" fill="#ECECEC" font-family="Georgia, serif" font-style="italic" font-size="14" text-anchor="middle">w_{t+1}</text>

    <rect x="118" y="114" width="66" height="28" rx="5" fill="#83C167" fill-opacity="0.16" stroke="#83C167" stroke-width="1.5"/>
    <text x="151" y="133" fill="#ECECEC" font-family="Georgia, serif" font-style="italic" font-size="14" text-anchor="middle">w_{t+2}</text>
  </g>

  <!-- Bottom formula card inside Left Panel -->
  <rect x="44" y="294" width="398" height="114" rx="8" fill="#131c2e" stroke="#58C4DD" stroke-opacity="0.35"/>
  <text x="243" y="320" fill="#ECECEC" font-family="Georgia, serif" font-size="14" text-anchor="middle">
    Ймовірність контексту через скалярний добуток векторів:
  </text>
  <text x="243" y="352" fill="#FFFF00" font-family="Georgia, serif" font-size="17" font-weight="bold" text-anchor="middle">
    P(w_O | w_I) = exp(u_{w_O}ᵀ v_{w_I}) / ∑ exp(u_wᵀ v_{w_I})
  </text>
  <text x="243" y="380" fill="#83C167" font-family="sans-serif" font-size="12" text-anchor="middle">
    💡 Трюк навчання: Negative Sampling замінює дорогу суму по |V|
  </text>
  <text x="243" y="398" fill="#8B949E" font-family="sans-serif" font-size="11.5" text-anchor="middle">
    на бінарну класифікацію (1 справжня пара проти k випадкових шумових).
  </text>

  <!-- RIGHT PANEL: 3b1b Vector Space Parallelogram -->
  <rect x="478" y="84" width="454" height="340" rx="10" fill="#0b101b" fill-opacity="0.88" stroke="#83C167" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="502" y="114" fill="#ECECEC" font-family="Georgia, serif" font-size="16" font-weight="bold">
    Геометрія простору ембедингів ℝᵈ (3b1b інтуїція)
  </text>
  <text x="502" y="136" fill="#FFFF00" font-family="Georgia, serif" font-style="italic" font-size="15">
    v(king) − v(man) + v(woman) ≈ v(queen)
  </text>

  <!-- Coordinate Axes -->
  <line x1="525" y1="375" x2="895" y2="375" stroke="#8B949E" stroke-width="1.5"/>
  <line x1="525" y1="375" x2="525" y2="155" stroke="#8B949E" stroke-width="1.5"/>
  <text x="770" y="398" fill="#8B949E" font-family="Georgia, serif" font-style="italic" font-size="13">Семантична вісь статі →</text>
  <text x="535" y="168" fill="#8B949E" font-family="Georgia, serif" font-style="italic" font-size="13">↑ Вісь королівського титулу</text>

  <!-- Parallelogram Vectors -->
  <!-- man: (585, 325), king: (635, 195), woman: (765, 315), queen: (815, 185) -->
  <!-- Royalty vectors (yellow glowing arrows) -->
  <line x1="585" y1="325" x2="631" y2="203" stroke="#FFFF00" stroke-width="3" marker-end="url(#arrY)" filter="url(#glow2)"/>
  <line x1="765" y1="315" x2="811" y2="193" stroke="#FFFF00" stroke-width="3" marker-end="url(#arrY)" filter="url(#glow2)"/>

  <!-- Gender vectors (teal dashed arrows) -->
  <line x1="585" y1="325" x2="755" y2="316" stroke="#5CD0B3" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arrT)"/>
  <line x1="635" y1="195" x2="805" y2="186" stroke="#5CD0B3" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arrT)"/>

  <!-- Vector Labels -->
  <text x="560" y="258" fill="#FFFF00" font-family="Georgia, serif" font-style="italic" font-size="13">+ титул</text>
  <text x="802" y="255" fill="#FFFF00" font-family="Georgia, serif" font-style="italic" font-size="13">+ титул</text>
  <text x="655" y="342" fill="#5CD0B3" font-family="Georgia, serif" font-style="italic" font-size="13">v(woman) − v(man)</text>

  <!-- Points -->
  <circle cx="585" cy="325" r="7" fill="#58C4DD" stroke="#ECECEC" stroke-width="1.5"/>
  <text x="568" y="352" fill="#58C4DD" font-family="Georgia, serif" font-weight="bold" font-size="16">man</text>

  <circle cx="635" cy="195" r="7" fill="#FFFF00" stroke="#ECECEC" stroke-width="1.5"/>
  <text x="615" y="178" fill="#FFFF00" font-family="Georgia, serif" font-weight="bold" font-size="16">king</text>

  <circle cx="765" cy="315" r="7" fill="#83C167" stroke="#ECECEC" stroke-width="1.5"/>
  <text x="750" y="342" fill="#83C167" font-family="Georgia, serif" font-weight="bold" font-size="16">woman</text>

  <circle cx="815" cy="185" r="8" fill="#9A72AC" stroke="#FFFF00" stroke-width="2" filter="url(#glow2)"/>
  <text x="795" y="168" fill="#ECECEC" font-family="Georgia, serif" font-weight="bold" font-size="16">queen</text>
</svg>