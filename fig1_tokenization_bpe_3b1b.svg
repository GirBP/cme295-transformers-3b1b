<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </radialGradient>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowYellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58C4DD"/>
    </marker>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#FFFF00"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#83C167"/>
    </marker>
  </defs>

  <!-- Background & 3b1b Coordinate Grid -->
  <rect width="960" height="440" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <g stroke="#58C4DD" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="60" x2="960" y2="60"/><line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="180" x2="960" y2="180"/><line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="300" x2="960" y2="300"/><line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="120" y1="0" x2="120" y2="440"/><line x1="240" y1="0" x2="240" y2="440"/>
    <line x1="360" y1="0" x2="360" y2="440"/><line x1="480" y1="0" x2="480" y2="440"/>
    <line x1="600" y1="0" x2="600" y2="440"/><line x1="720" y1="0" x2="720" y2="440"/>
    <line x1="840" y1="0" x2="840" y2="440"/>
  </g>

  <!-- Header -->
  <text x="34" y="42" fill="#ECECEC" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold">
    1. Токенізація: Word vs Character vs Subword (Byte-Pair Encoding)
  </text>
  <text x="34" y="66" fill="#58C4DD" font-family="Georgia, serif" font-style="italic" font-size="15">
    Фундаментальний компроміс між розміром словника |V| та довжиною послідовності L (00:16:56)
  </text>

  <!-- LEFT PANEL: 3 Tokenization Strategies -->
  <rect x="28" y="86" width="540" height="328" rx="10" fill="#0b101b" fill-opacity="0.85" stroke="#236B8E" stroke-width="1.5"/>

  <!-- Strategy 1: Word-level -->
  <text x="46" y="116" fill="#FC6255" font-family="sans-serif" font-size="14" font-weight="bold">
    A. Word-level (По словах) — |V| &gt; 500 000, проблема OOV
  </text>
  <rect x="46" y="128" width="110" height="36" rx="6" fill="#FC6255" fill-opacity="0.14" stroke="#FC6255" stroke-width="1.8"/>
  <text x="101" y="151" fill="#ECECEC" font-family="monospace" font-size="15" text-anchor="middle">Transformers</text>

  <rect x="166" y="128" width="56" height="36" rx="6" fill="#FC6255" fill-opacity="0.14" stroke="#FC6255" stroke-width="1.8"/>
  <text x="194" y="151" fill="#ECECEC" font-family="monospace" font-size="15" text-anchor="middle">are</text>

  <rect x="232" y="128" width="110" height="36" rx="6" fill="#FC6255" fill-opacity="0.14" stroke="#FC6255" stroke-width="1.8" stroke-dasharray="4,3"/>
  <text x="287" y="151" fill="#FC6255" font-family="monospace" font-size="14" text-anchor="middle">unaffable</text>

  <line x1="350" y1="146" x2="386" y2="146" stroke="#FC6255" stroke-width="2" marker-end="url(#arrowYellow)"/>

  <rect x="396" y="128" width="90" height="36" rx="6" fill="#FC6255" fill-opacity="0.28" stroke="#FFFF00" stroke-width="2"/>
  <text x="441" y="151" fill="#FFFF00" font-family="monospace" font-weight="bold" font-size="15" text-anchor="middle">[UNK]</text>
  <text x="46" y="182" fill="#8B949E" font-family="sans-serif" font-size="12">
    ✗ Рідкісні та нові слова втрачають значення і перетворюються на невідомий токен [UNK].
  </text>

  <!-- Strategy 2: Character-level -->
  <text x="46" y="216" fill="#F0AC5F" font-family="sans-serif" font-size="14" font-weight="bold">
    B. Character-level (По символах) — |V| ≈ 256, але L занадто велика
  </text>
  <g transform="translate(46, 228)">
    <rect x="0" y="0" width="34" height="34" rx="5" fill="#F0AC5F" fill-opacity="0.15" stroke="#F0AC5F" stroke-width="1.5"/>
    <text x="17" y="22" fill="#ECECEC" font-family="monospace" font-size="15" text-anchor="middle">u</text>
    <rect x="42" y="0" width="34" height="34" rx="5" fill="#F0AC5F" fill-opacity="0.15" stroke="#F0AC5F" stroke-width="1.5"/>
    <text x="59" y="22" fill="#ECECEC" font-family="monospace" font-size="15" text-anchor="middle">n</text>
    <rect x="84" y="0" width="34" height="34" rx="5" fill="#F0AC5F" fill-opacity="0.15" stroke="#F0AC5F" stroke-width="1.5"/>
    <text x="101" y="22" fill="#ECECEC" font-family="monospace" font-size="15" text-anchor="middle">a</text>
    <rect x="126" y="0" width="34" height="34" rx="5" fill="#F0AC5F" fill-opacity="0.15" stroke="#F0AC5F" stroke-width="1.5"/>
    <text x="143" y="22" fill="#ECECEC" font-family="monospace" font-size="15" text-anchor="middle">f</text>
    <rect x="168" y="0" width="34" height="34" rx="5" fill="#F0AC5F" fill-opacity="0.15" stroke="#F0AC5F" stroke-width="1.5"/>
    <text x="185" y="22" fill="#ECECEC" font-family="monospace" font-size="15" text-anchor="middle">f</text>
    <rect x="210" y="0" width="34" height="34" rx="5" fill="#F0AC5F" fill-opacity="0.15" stroke="#F0AC5F" stroke-width="1.5"/>
    <text x="227" y="22" fill="#ECECEC" font-family="monospace" font-size="15" text-anchor="middle">a</text>
    <rect x="252" y="0" width="34" height="34" rx="5" fill="#F0AC5F" fill-opacity="0.15" stroke="#F0AC5F" stroke-width="1.5"/>
    <text x="269" y="22" fill="#ECECEC" font-family="monospace" font-size="15" text-anchor="middle">b</text>
    <rect x="294" y="0" width="34" height="34" rx="5" fill="#F0AC5F" fill-opacity="0.15" stroke="#F0AC5F" stroke-width="1.5"/>
    <text x="311" y="22" fill="#ECECEC" font-family="monospace" font-size="15" text-anchor="middle">l</text>
    <rect x="336" y="0" width="34" height="34" rx="5" fill="#F0AC5F" fill-opacity="0.15" stroke="#F0AC5F" stroke-width="1.5"/>
    <text x="353" y="22" fill="#ECECEC" font-family="monospace" font-size="15" text-anchor="middle">e</text>
    <text x="385" y="22" fill="#F0AC5F" font-family="Georgia, serif" font-style="italic" font-size="14">L × 5 токенів!</text>
  </g>
  <text x="46" y="282" fill="#8B949E" font-family="sans-serif" font-size="12">
    ✗ Символи не несуть семантики; складність Self-Attention O(L²) зростає в 25 разів.
  </text>

  <!-- Strategy 3: Subword BPE -->
  <text x="46" y="318" fill="#58C4DD" font-family="sans-serif" font-size="14" font-weight="bold">
    C. Subword / BPE (Золотий стандарт LLM) — |V| ≈ 50 000 – 100 000
  </text>
  <g transform="translate(46, 330)" filter="url(#glowBlue)">
    <rect x="0" y="0" width="80" height="40" rx="7" fill="#58C4DD" fill-opacity="0.22" stroke="#58C4DD" stroke-width="2.2"/>
    <text x="40" y="25" fill="#ECECEC" font-family="monospace" font-weight="bold" font-size="16" text-anchor="middle">un</text>

    <rect x="96" y="0" width="96" height="40" rx="7" fill="#5CD0B3" fill-opacity="0.22" stroke="#5CD0B3" stroke-width="2.2"/>
    <text x="144" y="25" fill="#ECECEC" font-family="monospace" font-weight="bold" font-size="16" text-anchor="middle">##aff</text>

    <rect x="208" y="0" width="106" height="40" rx="7" fill="#83C167" fill-opacity="0.22" stroke="#83C167" stroke-width="2.2"/>
    <text x="261" y="25" fill="#ECECEC" font-family="monospace" font-weight="bold" font-size="16" text-anchor="middle">##able</text>
  </g>
  <text x="378" y="350" fill="#83C167" font-family="monospace" font-size="13">ID: [412, 8914, 1205]</text>
  <text x="378" y="368" fill="#FFFF00" font-family="sans-serif" font-size="12">✓ Зберігає морфологію</text>
  <text x="46" y="394" fill="#83C167" font-family="sans-serif" font-size="12.5" font-weight="bold">
    ✓ Часті слова залишаються цілими, рідкісні — розпадаються на значущі корені, префікси й суфікси.
  </text>

  <!-- RIGHT PANEL: BPE Iterative Merge Tree -->
  <rect x="588" y="86" width="344" height="328" rx="10" fill="#0b101b" fill-opacity="0.85" stroke="#58C4DD" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="610" y="116" fill="#FFFF00" font-family="Georgia, serif" font-size="16" font-weight="bold">
    Дерево злиття BPE (Byte-Pair Encoding)
  </text>
  <text x="610" y="136" fill="#8B949E" font-family="sans-serif" font-size="12">
    На кожному кроці об'єднується найчастіша пара:
  </text>

  <!-- Level 0: Characters -->
  <g transform="translate(625, 156)">
    <rect x="0" y="0" width="38" height="30" rx="5" fill="#1e293b" stroke="#58C4DD" stroke-width="1.5"/>
    <text x="19" y="20" fill="#ECECEC" font-family="monospace" font-size="15" text-anchor="middle">l</text>

    <rect x="56" y="0" width="38" height="30" rx="5" fill="#1e293b" stroke="#58C4DD" stroke-width="1.5"/>
    <text x="75" y="20" fill="#ECECEC" font-family="monospace" font-size="15" text-anchor="middle">o</text>

    <rect x="112" y="0" width="38" height="30" rx="5" fill="#1e293b" stroke="#58C4DD" stroke-width="1.5"/>
    <text x="131" y="20" fill="#ECECEC" font-family="monospace" font-size="15" text-anchor="middle">w</text>

    <rect x="168" y="0" width="38" height="30" rx="5" fill="#1e293b" stroke="#FFFF00" stroke-width="1.8"/>
    <text x="187" y="20" fill="#FFFF00" font-family="monospace" font-size="15" text-anchor="middle">e</text>

    <rect x="224" y="0" width="38" height="30" rx="5" fill="#1e293b" stroke="#FFFF00" stroke-width="1.8"/>
    <text x="243" y="20" fill="#FFFF00" font-family="monospace" font-size="15" text-anchor="middle">r</text>

    <!-- Merge 1: (e, r) -> er -->
    <path d="M 187 34 L 215 66 M 243 34 L 215 66" stroke="#FFFF00" stroke-width="2"/>
    <rect x="186" y="68" width="58" height="32" rx="6" fill="#FFFF00" fill-opacity="0.18" stroke="#FFFF00" stroke-width="2" filter="url(#glowYellow)"/>
    <text x="215" y="89" fill="#FFFF00" font-family="monospace" font-weight="bold" font-size="15" text-anchor="middle">er</text>
    <text x="255" y="88" fill="#8B949E" font-family="monospace" font-size="11">Крок 1</text>

    <!-- Merge 2: (l, o) -> lo -->
    <path d="M 19 34 L 47 66 M 75 34 L 47 66" stroke="#58C4DD" stroke-width="2"/>
    <rect x="18" y="68" width="58" height="32" rx="6" fill="#58C4DD" fill-opacity="0.18" stroke="#58C4DD" stroke-width="2"/>
    <text x="47" y="89" fill="#58C4DD" font-family="monospace" font-weight="bold" font-size="15" text-anchor="middle">lo</text>
    <text x="-28" y="88" fill="#8B949E" font-family="monospace" font-size="11">Крок 2</text>

    <!-- Merge 3: (lo, w) -> low -->
    <path d="M 47 102 L 88 142 M 131 34 L 88 142" stroke="#83C167" stroke-width="2.2"/>
    <rect x="52" y="144" width="72" height="34" rx="6" fill="#83C167" fill-opacity="0.22" stroke="#83C167" stroke-width="2.2"/>
    <text x="88" y="166" fill="#83C167" font-family="monospace" font-weight="bold" font-size="16" text-anchor="middle">low</text>
    <text x="-8" y="165" fill="#8B949E" font-family="monospace" font-size="11">Крок 3</text>

    <!-- Final Tokens -->
    <path d="M 88 180 L 115 210 M 215 102 L 185 210" stroke="#5CD0B3" stroke-width="2" stroke-dasharray="4,3"/>
    <rect x="55" y="212" width="190" height="36" rx="8" fill="#58C4DD" fill-opacity="0.15" stroke="#5CD0B3" stroke-width="2"/>
    <text x="150" y="235" fill="#ECECEC" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">["low", "##er"]</text>
  </g>
</svg>